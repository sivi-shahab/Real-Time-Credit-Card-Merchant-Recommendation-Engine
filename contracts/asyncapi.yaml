asyncapi: 3.0.0
info:
  title: Credit Card Merchant Recommendation Engine — events
  version: 1.0.0
  description: >
    EVT-001..005. The payload is a typed record, never a free-form object; money is an
    integer in minor units. The Avro schemas in ./avro are the contract (EVT-004,
    BACKWARD_TRANSITIVE, checked in CI by scripts/check_avro_compat.py). The wire is
    JSON for now (ADR-0001): timestamps travel as ISO-8601 strings and map to Avro
    timestamp-millis; tests/test_contracts.py round-trips every produced message.
defaultContentType: application/json

servers:
  local:
    host: localhost:29092
    protocol: kafka
    description: Docker Compose single-node KRaft broker

channels:
  ccTransactions:
    address: cc.transactions
    messages: { transaction: { $ref: '#/components/messages/TransactionEvent' } }
    bindings: { kafka: { topic: cc.transactions, partitions: 6, replicas: 1 } }
    description: Raw ingested transactions, keyed by customerId. Retention 7 days.
  customerFeatures:
    address: customer.features
    messages: { update: { $ref: '#/components/messages/FeatureUpdate' } }
    description: Feature version bump per customer, keyed by customerId. Compacted.
  recommendationImpressions:
    address: recommendation.impressions
    messages: { impression: { $ref: '#/components/messages/Impression' } }
    description: >
      Reserved (EVT-002). Not produced yet: impressions arrive over REST and are stored in
      Postgres. Gets an Avro schema when a producer exists.
  recommendationInteractions:
    address: recommendation.interactions
    messages: { interaction: { $ref: '#/components/messages/Interaction' } }
    description: >
      Reserved (EVT-002). Not produced yet: interactions arrive over REST and are stored
      in Postgres. Gets an Avro schema when a producer exists.
  pipelineDlq:
    address: pipeline.dlq
    messages: { rejected: { $ref: '#/components/messages/Rejected' } }
    description: Quarantined events with their reject code. Retention 14 days.

operations:
  publishTransaction:
    action: send
    channel: { $ref: '#/channels/ccTransactions' }
    summary: Ingestion service and the replay simulator publish here.
  consumeTransaction:
    action: receive
    channel: { $ref: '#/channels/ccTransactions' }
    summary: >
      Feature engine (group feature-engine). At-least-once; handling is idempotent on
      eventId and on transactionId.

components:
  messages:
    TransactionEvent:
      name: TransactionEvent
      summary: EVT-001 envelope with a typed transaction payload.
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema: { $ref: './avro/transaction_event.avsc' }
    FeatureUpdate:
      name: FeatureUpdate
      summary: Feature version bump; consumers re-read the online store.
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema: { $ref: './avro/feature_update.avsc' }
    Rejected:
      name: RejectedEvent
      summary: Quarantined message with its reject code; the original is kept as JSON text.
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema: { $ref: './avro/rejected_event.avsc' }
    Impression:
      name: Impression
      summary: Reserved; see channel description.
      payload:
        type: object
        properties:
          impressionId: { type: string }
          requestId: { type: string }
          customerId: { type: string }
          merchantId: { type: string }
          position: { type: integer }
          modelVersion: { type: string }
    Interaction:
      name: Interaction
      summary: Reserved; see channel description.
      payload:
        type: object
        properties:
          impressionId: { type: string }
          customerId: { type: string }
          merchantId: { type: string }
          interactionType:
            type: string
            enum: [CLICK, PROMO_ACTIVATION, REDEMPTION]
