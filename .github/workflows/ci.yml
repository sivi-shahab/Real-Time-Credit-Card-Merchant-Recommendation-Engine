name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rec, POSTGRES_PASSWORD: rec, POSTGRES_DB: rec }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rec" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      POSTGRES_DSN: postgresql://rec:rec@localhost:5432/rec
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # Avro check compares against every committed version
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check rec tests scripts
      - name: Tests (unit, generator, ML, integration, E2E)
        run: .venv/bin/pytest tests -q
      - name: Contract drift
        run: |
          .venv/bin/python scripts/export_openapi.py
          git diff --exit-code contracts/openapi.json
      - name: Avro compatibility (EVT-004, BACKWARD_TRANSITIVE)
        run: .venv/bin/python scripts/check_avro_compat.py
      - name: Alert rules (promtool check + unit tests)
        run: |
          for cmd in "check rules alerts.yml" "test rules alerts_test.yml"; do
            docker run --rm -v "$PWD/deploy/prometheus:/w" -w /w --entrypoint promtool \
              prom/prometheus:v2.55.1 $cmd
          done
      # SDD 17.2 step 6-7: SAST, dependency scan, SBOM
      - name: SAST (bandit, medium+)
        run: uvx bandit -q -r rec -ll
      - name: Dependency vulnerabilities
        run: uvx pip-audit --path .venv/lib/python3.12/site-packages
      - name: SBOM (CycloneDX)
        run: uvx --from cyclonedx-bom cyclonedx-py environment .venv > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx vue-tsc --noEmit
      - run: npx vitest run
      - run: npm run build
