name: rec-engine

x-backend-env: &backend_env
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_URL: redis://redis:6379/0
  # E-4: services connect as rec_app (data access only); `migrate` applies the schema as
  # the owner before anything starts
  POSTGRES_DSN: postgresql://rec_app:rec-app-local@postgres:5432/rec
  DB_AUTO_MIGRATE: "false"
  DATA_DIR: /app/data
  ENVIRONMENT: local
  MODEL_DIR: /app/data/models
  MLFLOW_TRACKING_URI: sqlite:////app/data/mlflow.db
  RANKING_SERVICE_URL: http://ranking:8100
  # D-5: the API's credential at the ranking service; both read it from here
  RANKING_SERVICE_TOKEN: local-dev-ranking-token-change-me
  # Traces from api and ranking (the others do not start tracing). Every request here;
  # production samples 10% (docs/runbooks.md#tracing): tracing all cost ~30% throughput
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  # BFF (SDD 13.4). Plain-http local stack, hence no Secure cookie.
  COOKIE_SECURE: "false"
  OIDC_DISCOVERY_URL: http://keycloak:8080/realms/rec/.well-known/openid-configuration
  OIDC_CLIENT_ID: rec-dashboard
  OIDC_CLIENT_SECRET: local-dev-secret-change-me
  OIDC_REDIRECT_URI: http://localhost:5173/bff/callback

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      # local single node: RF/min-ISR of 3/2 is a production setting (EVT-003)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rec
      POSTGRES_PASSWORD: rec
      POSTGRES_DB: rec
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["56379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: python -m rec.store.pg
    environment:
      <<: *backend_env
      POSTGRES_DSN: postgresql://rec:rec@postgres:5432/rec
      APP_DB_PASSWORD: rec-app-local
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    # no command: the image's, scripts/serve.sh with $WEB_CONCURRENCY workers
    environment:
      <<: *backend_env
      # p95 < 200 ms at 32 concurrent clients, cache misses included, took 8 processes on
      # a 16-core host (release gate). Size to the cores the API gets.
      WEB_CONCURRENCY: "8"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      # per worker: 8 x 6, plus stream and worker (20 each), stays under Postgres's 100
      PG_MAX_CONNECTIONS: "6"
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ranking: {condition: service_started}

  ranking:
    build: .
    command: ["sh", "scripts/serve.sh", "rec.ranking.service:app", "8100"]
    environment:
      <<: *backend_env
      # One process scores ~80 requests/s of 200 candidates; 8 single-threaded workers
      # held p95 < 500 ms end to end at 32 clients (release gate). Workers x
      # RANKING_THREADS is the cores it uses.
      WEB_CONCURRENCY: "8"
      RANKING_THREADS: "1"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    ports: ["8100:8100"]
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      retries: 10

  mlflow:
    build: .
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////app/data/mlflow.db
      --default-artifact-root /app/data/mlartifacts
    environment: *backend_env
    ports: ["5000:5000"]
    volumes: ["./data:/app/data"]

  stream:
    build: .
    command: python -m rec.stream.processor
    environment: *backend_env
    volumes: ["./data:/app/data"]
    depends_on:
      api: {condition: service_started}
      kafka: {condition: service_healthy}

  # Training queue, scheduled uplift report and the learning loops (ADR-0012), so
  # none of it runs on an API replica. Scale it; jobs and passes are locked.
  worker:
    build: {context: ., args: {EXTRAS: "[causal]"}}
    command: python -m rec.worker
    environment: *backend_env
    volumes: ["./data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ranking: {condition: service_started}

  dashboard:
    build: ./dashboard  # same-origin: nginx proxies /api, /admin, /bff to the API
    ports: ["5173:80"]
    depends_on: [api]

  # SSO (SEC-001). Local realm with one demo user per role; production points the BFF at
  # the corporate IdP instead. Browser sees localhost:8180, the BFF uses keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes: ["./deploy/keycloak:/opt/keycloak/data/import:ro"]

  # Trace store and UI for the local stack (OTLP in on 4318); in-memory, restarts empty.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

volumes:
  pgdata:
  redisdata:
