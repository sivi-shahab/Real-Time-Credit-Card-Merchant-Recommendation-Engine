[project]
name = "rec-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aiokafka>=0.11",
  "redis>=5.2",
  "asyncpg>=0.30",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "orjson>=3.10",
  "httpx>=0.27",
  "xgboost>=2.1",
  "mlflow>=2.17",
  "prometheus-client>=0.21",
  "fastavro>=1.9",
  # exact: rec/ml/bandit.py serialises river's private model state (round-trip tested)
  "river==0.26.1",
  "optuna>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7"]
# Offline challengers only (rec/ml/benchmark.py, ADR-0009); never in the app image.
benchmark = ["catboost>=1.2"]
# Offline promo uplift (rec/ml/uplift.py, ADR-0010); serving never imports it.
causal = ["causalml>=0.17"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["rec*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# B008: FastAPI Depends() in defaults is the framework idiom.
# B904/B007/B905: style-level here; the raises are terminal and the loops are tuple
# unpacking over generated rows.
ignore = ["B008", "B904", "B007", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # a couple of tests assert "any rejection", deliberately
